<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cuentos infantiles">
    <meta property="og:url" content="https://ver-libros.netlify.app/">
    <meta property="og:image" content="https://ver-libros.netlify.app/img/rey.webp">
    <meta property="og:description" content="Mostrando cuentos infantiles">
    <meta name="description" content="Mostrando cuentos infantiles">

    <title>Cuentos</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="shortcut icon" href="./img/rey.webp" type="image/x-icon">
</head>

<body>
    <main>

        <h1 class="title">Cuentos infantiles</h1>
        <div class="content-button">
            <button class="contrast modal" type="button" name="openModal" aria-label="openModal" data-target="modal-1">
                <img src="./img/dam.webp" fetchpriority="high" width="263" height="344"
                    alt="Cuento La Dama y el Vagabundo">
            </button>
            <button class="contrast modal2" type="button" name="openModal" aria-label="openModal" data-target="modal-2">
                <img src="./img/rey.webp" fetchpriority="high" width="263" height="344" alt="Cuento Rey Leon">
            </button>
            <button class="contrast modal3" type="button" name="openModal" aria-label="openModal" data-target="modal-3">
                <img src="./img/pinocho.webp" fetchpriority="high" width="263" height="344" alt="Cuento Pinocho">
            </button>
        </div>

        <dialog id="modal-1" closedby="any">
            <article>
                <header>
                    <button aria-label="Close" rel="prev" data-target="modal-1"></button>
                    <h3>La Dama y el Vagabundo!</h3>
                </header>

                <embed src="./Disney.pdf">

                <footer>
                    <button role="button" class="secondary" data-target="modal-1">
                        Cancelar</button><button autofocus="" data-target="modal-1">
                        Confirmar
                    </button>
                </footer>
            </article>
        </dialog>
        <dialog id="modal-3">
            <article>
                <header>
                    <button aria-label="Close" rel="prev" data-target="modal-3"></button>
                    <h3>Pinocho!</h3>
                </header>

                <embed src="./DisneyWalt-Pinocho.pdf">

                <footer>
                    <button role="button" class="secondary" data-target="modal-3">
                        Cancelar</button><button data-target="modal-3">
                        Confirmar
                    </button>
                </footer>
            </article>
        </dialog>
        <dialog id="modal-2">
            <article>
                <header>
                    <button aria-label="Close" rel="prev" data-target="modal-2"></button>
                    <h3>El Rey Leon!</h3>
                </header>

                <embed src="./WaltDisney-ElReyLeon.pdf">

                <footer>
                    <button role="button" class="secondary" data-target="modal-2">
                        Cancelar</button><button data-target="modal-2">
                        Confirmar
                    </button>
                </footer>
            </article>
        </dialog>
    </main>

    <!--  script -->
    <script src="./js/modal.js"></script>
    <!--  script -->
</body>

</html>
